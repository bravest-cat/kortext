[project]
name = "kortext"
version = "2.0.0"
description = "5-Tier Dual-Memory, AST Code Intelligence & Cognitive OS for Google Antigravity CLI"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
  { name = "Kortext Maintainers" }
]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
  "antigravity", "mcp", "fastmcp", "code-intelligence", "rag",
  "knowledge-graph", "falkordb", "qdrant", "tree-sitter", "ast", "hipporag"
]
dependencies = [
  "fastmcp>=4.1",
  "qdrant-client>=1.12.0",
  "fastembed>=0.5.0",
  "redis>=5.0.0",
  "tree-sitter>=0.23.2,<0.27.0",
  "tree-sitter-python>=0.23.6,<0.26.0",
  "tree-sitter-typescript>=0.23.2,<0.24.0",
  "tree-sitter-javascript>=0.23.0,<0.26.0",
  "tree-sitter-rust>=0.23.0,<0.25.0",
  "tree-sitter-go>=0.23.0,<0.26.0",
  "protobuf>=4.25",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "watchdog>=4.0",
  "aiofiles>=23.2",
  "rich>=13.7",
  "falkordb>=1.7.1",
  "numpy>=1.26.0",
  "scipy>=1.10.0",
  "psutil>=5.9.0",
  "jinja2>=3.1",
  "networkx>=3.0",
]

[project.optional-dependencies]
tier2-languages = [
  "tree-sitter-c>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "tree-sitter-java>=0.23.0",
  "tree-sitter-kotlin>=1.0.0",
  "tree-sitter-swift>=0.7.0",
  "tree-sitter-c-sharp>=0.23.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/bravest-cat/kortext"
Repository = "https://github.com/bravest-cat/kortext.git"

[project.scripts]
kortext           = "kortext.cli:main"
kortext-server    = "kortext.server:main"
kortext-ingest    = "kortext.ingest:main"
kortext-watch     = "kortext.watcher:main"
kortext-dashboard = "kortext.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
filterwarnings = [
    "always::DeprecationWarning",
]

