name: Kortext CI

env:
  # Windows runners default to cp1252; the hook scripts print emoji.
  PYTHONUTF8: "1"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux-substrates:
    name: Linux Full Substrate Suite (FalkorDB + Qdrant, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    services:
      falkordb:
        image: falkordb/falkordb@sha256:0fb85036662ce3d1206530a38fdf7df5a92b1fb31ad23087f8d4e89038ce0812  # latest as tested 2026-10-27
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant@sha256:2d1b0bfd0a961275481ea09400fc98008216ae54e1b52ed7d24520d63050c644  # latest as tested 2026-10-27
        ports:
          - 6333:6333

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Wait for Services
        run: |
          echo "Waiting for background services..."
          for i in {1..30}; do
            if nc -z localhost 6379 && curl -s -f http://localhost:6333/healthz > /dev/null 2>&1; then
              echo "FalkorDB and Qdrant are ready!"
              break
            fi
            echo "Waiting for services to become healthy ($i/30)..."
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --python ${{ matrix.python }} --extra tier2-languages --extra dev

      - name: Run Kortext Test Suite
        env:
          CI: "1"
        run: |
          uv run pytest -q

      - name: Run Antigravity Lifecycle Hooks Test Suite
        run: |
          uv run python3 scripts/test_antigravity_hooks.py

      - name: Run Plugin Manifest Validation
        run: |
          uv run python3 scripts/test_plugin_manifest.py

  test-cross-platform:
    name: Cross-Platform Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --extra tier2-languages --extra dev

      - name: Run Plugin Manifest & Hooks Suite
        run: |
          uv run python3 scripts/test_plugin_manifest.py
          uv run python3 scripts/test_antigravity_hooks.py

      - name: Run Cross-Platform Unit & Regression Suites
        env:
          CI: "1"
        run: |
          uv run pytest -q tests/test_cli_commands.py tests/test_binaries.py tests/test_retrieval_pipeline.py tests/test_dashboard_routes.py tests/test_graph_views.py tests/test_audit_regressions.py tests/test_audit_fixes.py tests/test_deep_audit_remediations.py tests/test_complete_audit_verification.py

  validate-agy-plugin:
    name: agy plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the plugin the way agy loads it
        run: agy plugin validate --strict integrations/antigravity
